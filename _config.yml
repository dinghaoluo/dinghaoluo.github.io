# build and theme settings
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "default"
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-remote-theme

# site settings
locale: "en-GB"
title: "hao things"
title_separator: "|"
email: dinghao.luo@outlook.com
description: >-
  Dinghao Luo, PhD, systems neuroscientist and data scientist; statistical modelling, machine learning, scientific software, translation, writing, and visualisation.
baseurl: ""
url: "https://dinghaoluo.github.io"
repository: "dinghaoluo/dinghaoluo.github.io"
words_per_minute: 200
og_image: "/assets/images/social-card.png?v=1"

comments:
  provider: false

atom_feed:
  hide: false

search: false

# analytics
analytics:
  provider: false


# site author
author:
  name             : "Dinghao Luo, PhD"
  name_zh          : "羅 丁豪"
  avatar           : "/assets/images/avatar.jpg"
  bio              : "systems neuroscience<br>data science<br>science journalism"
  bio_mobile       : "systems neuroscience<br>data science · sci. journalism"
  links:
    - label: "email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:dinghao.luo@outlook.com"
    - label: "github"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dinghaoluo"
    - label: "linkedin"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/dinghaoluo/"
    - label: "substack"
      icon: "fas fa-fw fa-pen-nib"
      url: "https://substack.com/@dinghaoluo"
    - label: "cv"
      icon: "fas fa-fw fa-file"
      url: "/cv/"

# site footer
footer:
  links:
    - label: "email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:dinghao.luo@outlook.com"
    - label: "github"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dinghaoluo"
    - label: "linkedin"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/dinghaoluo/"
    - label: "substack"
      icon: "fas fa-fw fa-pen-nib"
      url: "https://substack.com/@dinghaoluo"
    - label: "cv"
      icon: "fas fa-fw fa-file"
      url: "/cv/"


# reading files
include:
  - .htaccess
  - _pages
  - google6e85125fae140679.html
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - README.md
  - tmp
  - /docs  # ignore Minimal Mistakes /docs
  - /test  # ignore Minimal Mistakes /test
  - scripts
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# md processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone:


# collections
collections:
  writing:
    output: true
    permalink: /writing/:title/


whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-remote-theme


# archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/


# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development


# defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: false
      related: true
      show_date: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      toc: false
  - scope:
      path: "_writing"
      type: writing
    values:
      layout: single
      author_profile: true
